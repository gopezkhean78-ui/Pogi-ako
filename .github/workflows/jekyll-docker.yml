name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
- name: gpzz
  # You may pin to the exact commit or the version.
  # uses: tidbcloud/setup-tidbcloud-cli@8f5abeedc40290b4050635842d9e5efd75415faa
  uses: tidbcloud/setup-tidbcloud-cli@v0.2.0
  with:
    # Version of the `ticloud` to install. If unspecified or set to "latest",
the latest available `ticloud` version for the target platform will be
installed. Example: "0.1.6".
    version: # optional, default is latest
    # The public key of TiDB Cloud api.
    api_public_key: 
    # The private key of TiDB Cloud api.
    api_private_key: 
